# FTISP dashboard — reverse proxy for sad.shivang.me
#
# certbot rewrites the listen/server_name lines when it installs the certificate; the rest is
# managed by hand. Redeploying this file means re-running certbot or restoring the TLS block.

upstream ftisp_app {
    server 127.0.0.1:8100;
    keepalive 8;
}

# Redirect plain HTTP to HTTPS once a certificate exists. Before certbot runs, this block is what
# serves the ACME challenge, so it must stay reachable on port 80.
server {
    listen 80;
    listen [::]:80;
    server_name sad.shivang.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sad.shivang.me;

    # certbot --nginx fills these in. Kept here so the file is self-contained after issuance.
    ssl_certificate     /etc/letsencrypt/live/sad.shivang.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sad.shivang.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The dashboard drives a CPU-bound simulation; keep request bodies small.
    client_max_body_size 64k;

    # Basic auth: the dashboard lets anyone start runs on the server's CPU.
    auth_basic "FTISP";
    auth_basic_user_file /etc/nginx/.htpasswd-ftisp;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # WebSocket carries the round-by-round stream; needs the upgrade dance and a long timeout,
    # because a run can take minutes.
    location /ws/ {
        proxy_pass http://ftisp_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://ftisp_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
