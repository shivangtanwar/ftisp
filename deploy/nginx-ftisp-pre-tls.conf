# FTISP dashboard — HTTP-only, used once to bootstrap the certificate.
#
# This file is installed only when no certificate exists yet. nginx must be able to start and
# serve the ACME challenge before certbot can issue anything, so this version has no ssl_certificate
# directives. `certbot --nginx` then rewrites it in place, adding the TLS server block and the
# redirect. Afterwards the deploy script installs deploy/nginx-ftisp.conf only if forced.

upstream ftisp_app {
    server 127.0.0.1:8100;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name sad.shivang.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 64k;

    auth_basic "FTISP";
    auth_basic_user_file /etc/nginx/.htpasswd-ftisp;

    location /ws/ {
        proxy_pass http://ftisp_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://ftisp_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
